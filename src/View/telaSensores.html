<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sensores — SGE Escolar</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --navy: #0d1117;
      --navy-card: #111820;
      --teal: #00d4aa;
      --teal-dim: rgba(0,212,170,0.10);
      --teal-border: rgba(0,212,170,0.22);
      --blue: #4a9eff;
      --border: rgba(255,255,255,0.07);
      --text: #f0f4f8;
      --muted: rgba(255,255,255,0.42);
      --danger: #ff5f5f;
      --danger-dim: rgba(255,95,95,0.10);
      --radius: 14px;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--navy);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 2rem;
      height: 56px;
      background: rgba(13,17,23,0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }

    .nav-back {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
      text-decoration: none;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .nav-logo {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }

    .nav-logo span {
      color: var(--teal);
      font-weight: 300;
    }

    .nav-badge {
      font-size: 10px;
      font-weight: 600;
      color: var(--teal);
      background: var(--teal-dim);
      border: 1px solid var(--teal-border);
      padding: 2px 9px;
      border-radius: 20px;
      letter-spacing: 0.8px;
    }

    .nav-right {
      margin-left: auto;
    }

    .nav-timer {
      font-size: 11px;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .timer-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--teal);
      animation: blink 1.5s ease-in-out infinite;
    }

    @keyframes blink {
      0%,100% { opacity: 1; }
      50% { opacity: .2; }
    }

    .wrapper {
      position: relative;
      z-index: 1;
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 24px 80px;
      display: grid;
      grid-template-columns: 320px 1fr;
      grid-template-rows: auto auto 1fr;
      gap: 24px;
    }

    .page-header {
      grid-column: 1 / -1;
    }

    .page-eyebrow {
      font-size: 10px;
      font-weight: 700;
      color: var(--teal);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .eyebrow-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--teal);
    }

    .page-title {
      font-family: 'DM Serif Display', serif;
      font-size: clamp(1.7rem, 3vw, 2.4rem);
      font-weight: 400;
      line-height: 1.15;
    }

    .page-title em {
      color: var(--teal);
      font-style: italic;
    }

    .page-sub {
      font-size: .84rem;
      color: var(--muted);
      line-height: 1.7;
      margin-top: 6px;
    }

    .totais-bar {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: var(--border);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .total-item {
      background: var(--navy-card);
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .total-val {
      font-size: 1.4rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .total-val.agua { color: var(--blue); }
    .total-val.energia { color: var(--teal); }
    .total-val.geral { color: var(--text); }
    .total-val.count { color: var(--teal); }

    .total-label {
      font-size: .72rem;
      color: var(--muted);
    }

    .panel-add {
      grid-column: 1;
      grid-row: 3;
    }

    .panel-dashboard {
      grid-column: 2;
      grid-row: 3;
    }

    .panel-title {
      font-size: .7rem;
      font-weight: 700;
      color: var(--teal);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .add-card {
      background: var(--navy-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 10px;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 6px;
    }

    .field input,
    .field select {
      width: 100%;
      padding: 9px 12px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }

    .field select option {
      background: #1a2332;
    }

    .btn-add {
      width: 100%;
      padding: 10px;
      background: var(--teal);
      border: none;
      border-radius: 8px;
      color: var(--navy);
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .ambientes-lista {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ambiente-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 12px;
    }

    .ambiente-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .ambiente-nome {
      font-weight: 600;
      color: var(--text);
    }

    .ambiente-tipo {
      font-size: 10px;
      font-weight: 700;
      color: var(--teal);
      text-transform: uppercase;
      letter-spacing: .8px;
    }

    .btn-remove {
      width: 26px;
      height: 26px;
      border-radius: 6px;
      background: var(--danger-dim);
      border: 1px solid rgba(255,95,95,0.2);
      color: var(--danger);
      font-size: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 14px;
    }

    .sensor-card {
      background: var(--navy-card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      position: relative;
      overflow: hidden;
    }

    .sensor-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, var(--teal), transparent);
    }

    .sc-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .sc-nome {
      font-size: .82rem;
      font-weight: 600;
      color: var(--text);
    }

    .sc-tipo {
      font-size: 9px;
      font-weight: 700;
      color: var(--teal);
      text-transform: uppercase;
      letter-spacing: .8px;
      background: var(--teal-dim);
      border: 1px solid var(--teal-border);
      padding: 2px 7px;
      border-radius: 10px;
    }

    .sc-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      font-size: 12px;
    }

    .sc-icon {
      font-size: 15px;
      width: 20px;
      text-align: center;
    }

    .sc-icon.agua { color: var(--blue); }
    .sc-icon.energia { color: var(--teal); }

    .sc-label {
      color: var(--muted);
      flex: 1;
    }

    .sc-val {
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      font-size: 13px;
    }

    .sc-val.agua { color: var(--blue); }
    .sc-val.energia { color: var(--teal); }

    .sc-total {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .sc-total-label {
      font-size: 10px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .6px;
    }

    .sc-total-val {
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
    }

    .empty-state {
      grid-column: 1 / -1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 24px;
      text-align: center;
      background: var(--navy-card);
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      color: var(--muted);
    }

    .empty-state i {
      font-size: 40px;
      margin-bottom: 12px;
      opacity: .3;
    }

    @media (max-width: 860px) {
      .wrapper {
        grid-template-columns: 1fr;
      }

      .panel-add,
      .panel-dashboard {
        grid-column: 1;
        grid-row: auto;
      }

      .totais-bar {
        grid-template-columns: repeat(2,1fr);
      }
    }
  </style>
</head>

<body>

<nav>
  <a class="nav-back" href="/painel"><i class="ti ti-arrow-left"></i> Painel</a>
  <span class="nav-logo">SGE <span>Escolar</span></span>
  <span class="nav-badge">Sensores</span>

  <div class="nav-right">
    <div class="nav-timer">
      <div class="timer-dot"></div>
      <span id="timerLabel">Atualizando em 15s</span>
    </div>
  </div>
</nav>

<div class="wrapper">

  <div class="page-header">
    <div>
      <div class="page-eyebrow">
        <div class="eyebrow-dot"></div>
        Monitoramento
      </div>
      <h1 class="page-title">Sensores de <em>água & energia</em></h1>
      <p class="page-sub">Adicione ambientes e acompanhe o consumo salvo no banco em tempo real.</p>
    </div>
  </div>

  <div class="totais-bar">
    <div class="total-item">
      <div class="total-val count" id="totalAmbientes">0</div>
      <div class="total-label">Ambientes ativos</div>
    </div>

    <div class="total-item">
      <div class="total-val agua" id="totalAgua">R$ 0,00</div>
      <div class="total-label">Gasto com água</div>
    </div>

    <div class="total-item">
      <div class="total-val energia" id="totalEnergia">R$ 0,00</div>
      <div class="total-label">Gasto com energia</div>
    </div>

    <div class="total-item">
      <div class="total-val geral" id="totalGeral">R$ 0,00</div>
      <div class="total-label">Gasto total</div>
    </div>
  </div>

  <div class="panel-add">
    <div class="panel-title">
      <i class="ti ti-plus"></i>
      Adicionar Ambiente
    </div>

    <div class="add-card">
      <div class="field">
        <label>Nome do ambiente</label>
        <input type="text" id="inputNome" placeholder="Ex: Sala 01, Banheiro A..."/>
      </div>

      <div class="field">
        <label>Tipo</label>
        <select id="inputTipo">
          <option value="">Selecione o tipo</option>
          <option value="SALA">Sala</option>
          <option value="BANHEIRO">Banheiro</option>
          <option value="PATIO">Pátio</option>
          <option value="QUADRA">Quadra</option>
          <option value="LABORATORIO">Laboratório</option>
          <option value="COZINHA">Cozinha</option>
        </select>
      </div>

      <button class="btn-add" onclick="adicionarAmbiente()">
        <i class="ti ti-plus"></i>
        Adicionar
      </button>

      <div class="ambientes-lista" id="listaAmbientes"></div>
    </div>
  </div>

  <div class="panel-dashboard">
    <div class="panel-title">
      <i class="ti ti-chart-bar"></i>
      Consumo por Ambiente
    </div>

    <div class="dashboard-grid" id="dashboardGrid"></div>
  </div>

</div>

<script>
  const consumoPorTipo = {
    SALA:        { agua: false, energia: true },
    LABORATORIO: { agua: false, energia: true },
    PATIO:       { agua: false, energia: true },
    BANHEIRO:    { agua: true,  energia: true },
    COZINHA:     { agua: true,  energia: true },
    QUADRA:      { agua: true,  energia: true }
  };

  let ambientes = [];
  let countdown = 15;

  function formatarMoeda(valor) {
    return Number(valor || 0).toLocaleString('pt-BR', {
      style: 'currency',
      currency: 'BRL'
    });
  }

  async function carregarGastos() {
    try {
      const res = await fetch('/sensores/gastos');
      const data = await res.json();

      if (!data.sucesso) {
        console.error('Erro ao carregar gastos:', data.erro);
        return;
      }

      ambientes = data.gastos.map(a => ({
        id: a.id,
        nome: a.nome,
        tipo: a.tipo,
        valorAgua: Number(a.valor_agua) || 0,
        valorEnergia: Number(a.valor_energia) || 0,
        total: Number(a.total) || 0
      }));

      renderLista();
      renderDashboard();

    } catch (err) {
      console.error('Erro de conexão ao carregar gastos:', err);
    }
  }

  async function adicionarAmbiente() {
    const nome = document.getElementById('inputNome').value.trim();
    const tipo = document.getElementById('inputTipo').value;
    const btn = document.querySelector('.btn-add');

    if (!nome || !tipo) {
      alert('Preencha o nome e o tipo do ambiente.');
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="ti ti-loader-2"></i> Salvando...';

    try {
      const res = await fetch('/sensores/ambientes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome, tipo })
      });

      const data = await res.json();

      if (data.sucesso) {
        document.getElementById('inputNome').value = '';
        document.getElementById('inputTipo').value = '';
        await carregarGastos();
      } else {
        alert('Erro ao salvar: ' + data.erro);
      }

    } catch (err) {
      alert('Erro de conexão com o servidor.');
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<i class="ti ti-plus"></i> Adicionar';
    }
  }

  async function removerAmbiente(id) {
    const confirmar = confirm('Deseja remover este ambiente?');

    if (!confirmar) return;

    try {
      const res = await fetch(`/sensores/ambientes/${id}`, {
        method: 'DELETE'
      });

      const data = await res.json();

      if (data.sucesso) {
        await carregarGastos();
      } else {
        alert('Erro ao remover: ' + data.erro);
      }

    } catch (err) {
      alert('Erro de conexão com o servidor.');
    }
  }

  function renderLista() {
    const lista = document.getElementById('listaAmbientes');

    if (ambientes.length === 0) {
      lista.innerHTML = '';
      return;
    }

    lista.innerHTML = ambientes.map(a => `
      <div class="ambiente-item">
        <div class="ambiente-info">
          <span class="ambiente-nome">${a.nome}</span>
          <span class="ambiente-tipo">${a.tipo}</span>
        </div>

        <button class="btn-remove" onclick="removerAmbiente(${a.id})" title="Remover">
          <i class="ti ti-trash"></i>
        </button>
      </div>
    `).join('');
  }

  function renderDashboard() {
    const grid = document.getElementById('dashboardGrid');

    if (ambientes.length === 0) {
      grid.innerHTML = `
        <div class="empty-state">
          <i class="ti ti-radar-off"></i>
          <p>Nenhum ambiente cadastrado.<br>Adicione um ambiente ao lado para começar.</p>
        </div>
      `;

      atualizarTotais();
      return;
    }

    grid.innerHTML = ambientes.map(a => {
      const regra = consumoPorTipo[a.tipo] || { agua: false, energia: true };
      const temAgua = regra.agua;
      const temEnergia = regra.energia;

      return `
        <div class="sensor-card">
          <div class="sc-header">
            <span class="sc-nome">${a.nome}</span>
            <span class="sc-tipo">${a.tipo}</span>
          </div>

          ${temAgua ? `
            <div class="sc-row">
              <i class="ti ti-droplet sc-icon agua"></i>
              <span class="sc-label">Água</span>
              <span class="sc-val agua">${formatarMoeda(a.valorAgua)}</span>
            </div>
          ` : ''}

          ${temEnergia ? `
            <div class="sc-row">
              <i class="ti ti-bolt sc-icon energia"></i>
              <span class="sc-label">Energia</span>
              <span class="sc-val energia">${formatarMoeda(a.valorEnergia)}</span>
            </div>
          ` : ''}

          <div class="sc-total">
            <span class="sc-total-label">Total acumulado</span>
            <span class="sc-total-val">${formatarMoeda(a.total)}</span>
          </div>
        </div>
      `;
    }).join('');

    atualizarTotais();
  }

  function atualizarTotais() {
    const totalAgua = ambientes.reduce((soma, a) => soma + a.valorAgua, 0);
    const totalEnergia = ambientes.reduce((soma, a) => soma + a.valorEnergia, 0);
    const totalGeral = ambientes.reduce((soma, a) => soma + a.total, 0);

    document.getElementById('totalAmbientes').textContent = ambientes.length;
    document.getElementById('totalAgua').textContent = formatarMoeda(totalAgua);
    document.getElementById('totalEnergia').textContent = formatarMoeda(totalEnergia);
    document.getElementById('totalGeral').textContent = formatarMoeda(totalGeral);
  }

  function tickTimer() {
    countdown--;

    document.getElementById('timerLabel').textContent =
      countdown > 0 ? `Atualizando em ${countdown}s` : 'Atualizando...';

    if (countdown <= 0) {
      carregarGastos();
      countdown = 15;
    }
  }

  document.getElementById('inputNome').addEventListener('keydown', e => {
    if (e.key === 'Enter') {
      adicionarAmbiente();
    }
  });

  carregarGastos();
  setInterval(tickTimer, 1000);
</script>

</body>
</html>
